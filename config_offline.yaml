# 离线训练配置
# 适用于无网络集群

model:
  name: "./offline_assets/models/Qwen--Qwen3-8B"
  trust_remote_code: true

dataset:
  name: "./offline_assets/datasets/openbmb--UltraFeedback"
  split: "train"
  max_samples: null

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  use_8bit: true
  use_4bit: false

training:
  output_dir: "./output_offline"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  max_grad_norm: 1.0
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  save_total_limit: 3
  max_length: 512
  gradient_checkpointing: true
  fp16: true

ppo:
  epochs: 4
  mini_batch_size: 1

distributed:
  num_gpus: 4

seed: 42
log_with: "tensorboard"
